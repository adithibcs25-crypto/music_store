<!DOCTYPE html>

  <title>Indian Classical Encyclopedia - Swaranjali</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Museum Gallery layout styling distinct from the retail shop grid */
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 3rem; padding: 2rem 0; }
    .gallery-card { border-radius: 20px; overflow: hidden; background: var(--glass); text-align: center; border: 1px solid var(--glass-border); padding: 1.5rem; transition: transform 0.3s; }
    .gallery-card:hover { transform: scale(1.03); }
    .gallery-card img { width: 100%; height: 260px; object-fit: cover; border-radius: 12px; }
    .gallery-title { font-size: 1.6rem; margin: 1rem 0; font-family: Georgia, serif; font-weight: bold; }
    .btn-know-more { display: inline-block; padding: 0.6rem 2rem; border-radius: 25px; border: 2px solid var(--primary); text-decoration: none; color: var(--primary); font-weight: bold; transition: all 0.3s; }
    .btn-know-more:hover { background: var(--primary); color: white; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">Swaranjali</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="instruments.html" class="active">Instruments</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="cart.html">Cart</a></li>
    </ul>
  </nav>

  <section class="section">
    <h2 class="heading-center">Vedic & Classical Heritage Index</h2>
    <p style="text-align: center; margin-top: -2rem; margin-bottom: 3rem; opacity: 0.7;">Click on any instrument to dive deep into its history, craftsmanship, acoustic properties, and audio signatures.</p>
    
    <div class="gallery-grid" id="instruments-gallery-root">
      </div>
  </section>

  <script src="js/app.js"></script>
</body>
</html>
