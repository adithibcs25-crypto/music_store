<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Complete Success - Saptaswara</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="section" style="text-align:center; max-width:600px; margin:5rem auto;">
    <div class="card" style="padding:3rem; width:100%;">
      <div style="font-size:5rem; color:green; margin-bottom:1rem;">🎉</div>
      <h1 style="color:var(--primary); margin-bottom:1rem;">Order Placed Successfully!</h1>
      <p style="margin-bottom:1rem;">Your transaction has been processed securely. Your musical instrument is being prepared for transport.</p>
      <br>
      <div style="background:var(--bg-light); padding:1rem; border-radius:8px; margin-bottom:2rem; text-align:left;">
        <p><strong>Order Tracking ID:</strong> <span id="invoice-order-id">Pending</span></p>
        <p><strong>Estimated Arrival Window:</strong> 5-7 Business Days via Secured Logistics.</p>
      </div>
      
      <button class="btn-primary" onclick="downloadInvoicePDF()" style="width:100%; margin-bottom:1rem;">📥 Save Invoice as PDF</button>
      <a href="shop.html" class="btn-secondary" style="display:block; width:100%;">Continue Shopping</a>
    </div>
  </section>

  <script src="js/app.js"></script>
</body>
</html>
