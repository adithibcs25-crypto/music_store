<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Checkout Gateway</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">Swaranjali</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="instruments.html">Instruments</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="cart.html">Cart</a></li>
    </ul>
  </nav>

  <section class="section" style="max-width:600px; margin:0 auto;">
    <div class="card" style="padding:2.5rem; width:100%;">
      <h2 style="color:var(--primary); margin-bottom:1rem;">Secure Payment Processing</h2>
      <p style="font-size:1.2rem; margin-bottom:2rem;">Total Outlay Amount Due: <strong>₹<span id="amount-due">0</span></strong></p>
      
      <form id="payment-form">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" required placeholder="Rohan Sharma">
        </div>
        <div class="form-group">
          <label>Shipping Target Destination Address</label>
          <textarea required placeholder="Complete Residential Address Layout" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label>Payment Method Gateway selection</label>
          <select id="payment_method" class="filter-select" style="width:100%;">
            <option value="Credit Card">Debit/Credit Card</option>
            <option value="UPI">BHIM UPI Option</option>
            <option value="COD">Cash On Delivery (COD)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Mock Card Number / UPI String Identifier</label>
          <input type="text" id="card_number" required placeholder="1234 5678 9101 1121" minlength="16">
        </div>
        <br>
        <button type="submit" id="pay-btn" class="btn-primary" style="width:100%;">Authorize Payment</button>
      </form>
    </div>
  </section>

  <script src="js/app.js"></script>
</body>
</html>
